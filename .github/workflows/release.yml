# 릴리스 빌드/서명은 수동 실행 전용이며, 아직 완성되지 않은 뼈대입니다 (docs/BUILD.md 참고).
# 서명 키·비밀번호는 저장소에 커밋하지 않고 GitHub Secrets로만 주입합니다.
name: Release (manual)

on:
  workflow_dispatch:

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: 서명 설정 안내
        run: |
          echo "TODO: androidApp/build.gradle.kts 에 signingConfig 를 추가하고,"
          echo "      secrets.ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 를 사용하세요."
          echo "      아직 구성되지 않았으므로 이 워크플로는 서명된 APK를 만들지 않습니다."
