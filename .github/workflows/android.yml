name: Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: 광고/추적 의존성 검사 (소스)
        run: bash scripts/ad_audit.sh .
      - name: 단위 테스트 (shared)
        run: gradle :shared:test --stacktrace
      - name: Debug APK 빌드
        run: gradle :androidApp:assembleDebug --stacktrace
      - name: 전이 의존성 트리 검사
        run: |
          gradle :androidApp:dependencies --configuration releaseRuntimeClasspath > deps.txt
          if grep -Eiq 'applovin|admob|play-services-ads|audience|unity3d|chartboost|pangle|vungle|inmobi|ironsource|firebase-analytics|appsflyer' deps.txt; then
            echo "광고/추적 라이브러리가 의존성 트리에 있습니다:"; grep -Ei 'applovin|admob|play-services-ads|audience|unity3d|chartboost|pangle|vungle|inmobi|ironsource|firebase-analytics|appsflyer' deps.txt; exit 1
          fi
          echo "의존성 트리에서 광고/추적 라이브러리 없음"
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: deps.txt
      - name: 광고/추적 의존성 검사 (병합된 매니페스트 포함)
        run: bash scripts/ad_audit.sh .
      - uses: actions/upload-artifact@v4
        with:
          name: clearfetch-android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-test-report
          path: shared/build/reports/tests/test
